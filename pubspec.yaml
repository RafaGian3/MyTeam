name: myteam
description: "MyTeam – Aplikasi Mobile Pencarian dan Pembentukan Tim Mahasiswa Unand"
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client untuk komunikasi dengan backend API MyTeam
  http: ^1.2.2

  # Penyimpanan lokal untuk JWT token & sesi pengguna
  shared_preferences: ^2.3.2

  # Google Fonts — Inter (sesuai Design System "Academic Emerald Synergy")
  google_fonts: ^6.2.1
  image_picker: ^1.2.3
  file_picker: ^8.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
